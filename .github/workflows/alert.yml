# Says something, to somebody, when this repository needs a person.
#
# It is the only thing here that ever does. Everything a pull request can be — a submission,
# a submission with a mistake in it, or not a submission at all — is answered where it was
# opened and waits on nobody. What is left is this: a run that went red on main, which nothing
# else would ever mention, because nobody thinks to look at a registry that works.
#
# And admit, wherever it ran. It never goes red at a submitter — what they wrote is answered
# with a comment and an exit 0 — so a red one is the gate unable to run or main no longer
# requiring what a submission is admitted on. Both hold a pull request that is nobody's to
# push a change to, on a page only its author is watching.
#
# An Issue rather than mail from the runner, because an Issue stays open until it is dealt
# with. The mention in it is what delivers: a mention notifies whether or not the repository
# is watched, which is what lets the owner watch nothing and still hear about this.

name: alert

on:
  workflow_run:
    workflows: [admit, catalogue, ledger, gate]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  # A run that went red on main, and every red admit. Not the rest of what goes red on a pull
  # request: those are red at the author, who can see them, and are the system working rather
  # than the system broken. admit is the one that never is.
  failure:
    if: >
      github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'failure'
      && (github.event.workflow_run.name == 'admit'
      || github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Report it
        env:
          GH_TOKEN: ${{ github.token }}
          # This job checks nothing out, so gh has no repository to infer from a working copy.
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ github.event.workflow_run.name }}
          URL: ${{ github.event.workflow_run.html_url }}
          EVENT: ${{ github.event.workflow_run.event }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          gh label create ci-failure --color B60205 --description "A workflow is failing" 2>/dev/null || true

          title="${NAME} is failing"
          number=$(gh issue list --label ci-failure --state open --json number,title \
            --jq "[.[] | select(.title == \"${title}\") | .number] | first // empty")

          body="@${OWNER} — the \`${NAME}\` workflow failed on \`${BRANCH}\` (\`${EVENT}\`).

          ${URL}

          If this is the daily catalogue run, the likely cause is a package the ledger names that nuget.org serves no released version of. A release whose claims moved is not one of these: that one is withheld from the index and published as withheld, and the run goes on. The site keeps serving what was last published until this is fixed.

          If this is \`admit\`, it is the gate unable to run or \`main\` no longer requiring the checks a submission is admitted on. Nothing merges until it is dealt with, and the pull request it stopped is not one its author can push a change to."

          if [[ -n "$number" ]]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label ci-failure
          fi

