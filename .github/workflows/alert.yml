# Says something, to somebody, when this repository needs a person.
#
# It is the only thing here that ever does. A submission — one that agrees with its package,
# one with a mistake in it — is answered on its own issue and waits on nobody, and a pull
# request that is not the owner's is answered and closed. What is left is this: a run that
# went red on main, which nothing else would ever mention, because nobody thinks to look at a
# registry that works.
#
# And submit and admit, wherever they ran. Neither goes red at a submitter — what they wrote
# is answered with a comment — so a red one is the registry unable to read a submission, or
# unable to write one that agreed. Both leave somebody waiting on an issue only they are
# watching.
#
# An Issue rather than mail from the runner, because an Issue stays open until it is dealt
# with. The mention in it is what delivers: a mention notifies whether or not the repository
# is watched, which is what lets the owner watch nothing and still hear about this.

name: alert

on:
  workflow_run:
    workflows: [submit, admit, catalogue, ledger, gate]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  # A run that went red on main, and every red submit or admit. Not the rest of what goes red
  # on a pull request: those are red at the author, who can see them, and are the system
  # working rather than the system broken. submit and admit are the ones that never are.
  failure:
    if: >
      github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'failure'
      && (github.event.workflow_run.name == 'submit'
      || github.event.workflow_run.name == 'admit'
      || github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Report it
        env:
          GH_TOKEN: ${{ github.token }}
          # This job checks nothing out, so gh has no repository to infer from a working copy.
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ github.event.workflow_run.name }}
          URL: ${{ github.event.workflow_run.html_url }}
          EVENT: ${{ github.event.workflow_run.event }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          gh label create ci-failure --color B60205 --description "A workflow is failing" 2>/dev/null || true

          title="${NAME} is failing"
          number=$(gh issue list --label ci-failure --state open --json number,title \
            --jq "[.[] | select(.title == \"${title}\") | .number] | first // empty")

          body="@${OWNER} — the \`${NAME}\` workflow failed on \`${BRANCH}\` (\`${EVENT}\`).

          ${URL}

          If this is the daily catalogue run, the likely cause is a package the ledger names that nuget.org serves no released version of. A release whose claims moved is not one of these: that one is withheld from the index and published as withheld, and the run goes on. The site keeps serving what was last published until this is fixed.

          If this is \`submit\`, a submission could not be read or could not be written — most likely the registry's GitHub App token (\`REGISTRY_APP_CLIENT_ID\`, \`REGISTRY_APP_KEY\`) or its permission to push to \`main\`. The submitter has been told it was the registry's side; editing their issue reads it again once this is fixed."

          if [[ -n "$number" ]]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label ci-failure
          fi

