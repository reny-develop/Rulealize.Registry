# Answers a pull request that is not the owner's.
#
# A submission is not a pull request. It is made from the site's submit page, which opens an
# issue, and submit.yml reads it and writes the ledger — so nobody outside this repository
# has a reason to open one, and nothing that arrives as one is merged. A pull request that is
# not the owner's is answered with where a submission is made, and where anything else is
# raised, and closed: nothing is lost, and it waits on nobody.
#
# pull_request_target runs this file as it is on main, with a token that can close the pull
# request, and it never reads a line of what the pull request contains.

name: admit

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  answer:
    if: github.event.pull_request.user.login != github.repository_owner
    runs-on: ubuntu-latest

    steps:
      - name: Answer it, and close it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          body="This repository takes no submissions through a pull request. A plugin or a rule set is submitted from the [registry's submit page](https://reny-develop.github.io/Rulealize.Registry/submit/), which checks the package against nuget.org and opens the submission for you — and anything about the tools, the site or the policy belongs in an [issue](https://github.com/${GH_REPO}/issues).

          Closing this one — nothing is lost."

          gh pr comment "$PR" --body "$body"
          gh pr close "$PR"
