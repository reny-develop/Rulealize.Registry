# Merges a submission that has nothing left for a person to decide, and tells the person when
# it does.
#
# Everything a submission can get wrong about its own claims is already decided by ledger.yml,
# which fetches the packages and re-derives the file. This decides a different question:
# whether the change is the shape a submission has. A pull request that adds a row and touches
# nothing else has no judgement left in it, so it merges when the checks pass. Anything else
# is held, labelled and assigned, and the reason is written on the pull request.
#
# pull_request_target runs this file as it is on main, with a token that can merge — so the
# gate reads the pull request as data and never runs a line of it. The only thing that comes
# out of the pull request is JSON, read with `git show` and handed to jq.
#
# The rules themselves are in .github/admit/gate.sh, with a case for each in
# .github/admit/test/. They are not written here, because a rule nobody can run locally is a
# rule nobody can test.

name: admit

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest

    steps:
      # The base branch, which is where gate.sh and the reserved list are read from. A
      # submission cannot edit either to admit itself — and rule 2 refuses it for trying.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          mkdir -p work
          git fetch --no-tags --quiet origin "refs/pull/${PR}/head"

          # The merge base rather than the tip of main: a submission opened before something
          # else merged has not removed what it never had.
          merge_base=$(git merge-base "origin/${BASE}" FETCH_HEAD)
          git show "${merge_base}:ledger/claim.json" > work/base.json
          git show "FETCH_HEAD:ledger/claim.json" > work/head.json 2>/dev/null || : > work/head.json

          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --jq '.[].filename' > work/files.txt

      - name: Decide
        id: gate
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set +e
          reasons=$(bash .github/admit/gate.sh work/base.json work/head.json ledger/reserved.json work/files.txt)
          status=$?
          set -e

          # Exit 2 is the gate failing rather than refusing. It leaves the pull request
          # unmerged and this job red, which is the right way round.
          if [[ $status -gt 1 ]]; then
            echo "::error::The gate could not run."
            echo "$reasons"
            exit $status
          fi

          verdict=hold
          [[ $status -eq 0 ]] && verdict=admit
          echo "verdict=${verdict}" >> "$GITHUB_OUTPUT"
          {
            echo 'reasons<<GATE_EOF'
            echo "$reasons"
            echo 'GATE_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Act on it
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          VERDICT: ${{ steps.gate.outputs.verdict }}
          REASONS: ${{ steps.gate.outputs.reasons }}
          OWNER: ${{ github.repository_owner }}
          DRY_RUN: ${{ vars.ADMIT_DRY_RUN }}
        run: |
          set -euo pipefail

          if [[ "$VERDICT" == "admit" ]]; then
            gh pr edit "$PR" --remove-label needs-review 2>/dev/null || true

            if [[ "$DRY_RUN" == "true" ]]; then
              body="This adds a plugin and touches nothing else, so it would merge as soon as the checks pass. Auto-merge is not enabled yet: the gate is in dry run while it is watched."
            else
              gh pr merge "$PR" --auto --squash
              body="This adds a plugin and touches nothing else, so there is nothing here for a person to decide. It merges as soon as the checks pass — the ledger is re-derived from the package you named, and that is what decides whether the claim is true."
            fi
          else
            # Auto-merge survives a force-push, so a pull request that was admitted and has
            # since changed has to have it taken away again.
            gh pr merge "$PR" --disable-auto 2>/dev/null || true
            gh label create needs-review --color FBCA04 --description "Held for a person to read" 2>/dev/null || true
            gh pr edit "$PR" --add-label needs-review --add-assignee "$OWNER" >/dev/null

            body="@${OWNER} — this one is held for you.

          ${REASONS}
          None of that means the submission is wrong; it means it is outside what merges without review. [The grant policy](https://github.com/reny-develop/Rulealize.Registry/blob/main/doc/policy.md) is what it is held to."
          fi

          # One comment per pull request, edited in place, so a branch pushed six times does
          # not leave six of these.
          marker='<!-- admit -->'
          body="${marker}
          ${body}"

          existing=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
            --jq "[.[] | select(.body | startswith(\"${marker}\")) | .id] | last // empty")

          if [[ -n "$existing" ]]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="$body" >/dev/null
          fi
