# Builds the catalogue, and checks every published version against the ledger.
#
# The ledger holds one row per package because a claim is permanent; the catalogue holds one
# entry per version because `requires` and `uses` read ^1.0 and what a release offers may grow
# within a major. So a new version of anything already admitted needs no pull request: nothing
# committed changes and this run picks it up.
#
# Which is why this one IS scheduled, where the ledger's check is not. A release that nobody
# submits is exactly what a schedule is for, and it is also the only way a package could
# quietly rename itself between versions — a plugin moving its namespace, a rule set moving
# the identifier its document declares. So the same run that finds the release checks it
# against the ledger and withholds it from the index if it moved, on the entry's own page
# rather than in a log its publisher will never read.

name: catalogue

on:
  # No paths filter. This is a required check, and a required check a pull request
  # can skip by touching other files is one that blocks that pull request for ever.
  pull_request:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      plugins: ${{ steps.counts.outputs.plugins }}
      versions: ${{ steps.counts.outputs.versions }}
      operations: ${{ steps.counts.outputs.operations }}
      rulesets: ${{ steps.counts.outputs.rulesets }}
      withheld: ${{ steps.counts.outputs.withheld }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # Ahead of the crawl, because this takes seconds and the crawl takes minutes. Every
      # string on a page came out of somebody else's package, and these are the two that would
      # do something other than sit there. The cases are in tool/Site/test/.
      - name: Check the site against a hostile catalogue
        run: bash tool/Site/test/run.sh

      # The catalogue loads no plugin — one process cannot hold two versions of the same
      # assembly — and runs this once per version instead.
      - name: Build the probe
        run: dotnet publish tool/Ledger -c Release -o work/probe

      - name: Build the catalogue
        run: >
          dotnet run --project tool/Catalogue --
          ledger/submitted.json work/probe/Rulealize.Registry.Ledger.dll catalogue

      # What the crawl found, for the run this leaves behind on the checks branch. Read out of
      # the catalogue rather than counted along the way, so it is the published file talking.
      - name: Count what was found
        id: counts
        run: |
          set -euo pipefail

          # find rather than a glob: the rule set folder is written on every run and is empty
          # until somebody publishes one, and an unmatched glob is a failure rather than a zero.
          versions=$(find catalogue/plugin catalogue/ruleset -name '*.json' -print0 \
            | xargs -0 --no-run-if-empty cat \
            | jq -s '[.[].versions | length] | add // 0')

          {
            echo "plugins=$(jq '.plugins | length' catalogue/index.json)"
            echo "operations=$(jq '.operations | length' catalogue/index.json)"
            echo "rulesets=$(jq '(.ruleSets // []) | length' catalogue/index.json)"
            echo "versions=${versions}"
            echo "withheld=$(jq '[.plugins[].withheld, (.ruleSets // [])[].withheld] | add // 0' catalogue/index.json)"
          } >> "$GITHUB_OUTPUT"

      # Built on every run, including the ones that will not publish: a pull request, or any
      # ref that is not main. Holding the deploy step was the whole of what "the site is not
      # up yet" meant, and holding the build too would have left the generator as the one
      # part of this never exercised, broken on the day it mattered.
      - name: Render the pages
        run: dotnet run --project tool/Site -- catalogue site

      # Not committed: it is derived from nuget.org on every run, and a generated file in the
      # history would be one more thing that can disagree with what the packages say.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && vars.PUBLISH_SITE == 'true'
        with:
          path: site

  # Live: PUBLISH_SITE is set, and Pages takes its source from Actions. The flag stays
  # because only publishing sits behind it — everything above runs
  # either way, so a pull request still renders the pages it would deploy. Clearing the
  # variable stops future deploys; what is published stays up until Pages itself is off.
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.PUBLISH_SITE == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  # One line per run, on a branch of its own.
  #
  # It is here for a reason that has nothing to do with what it records: GitHub disables a
  # scheduled workflow in a public repository after 60 days with no repository activity, and
  # this repository is meant to go quiet. What counts as activity is not documented, so
  # whether a push made with GITHUB_TOKEN resets that clock is not something this can promise
  # — it is the cheapest thing that might, and it costs a branch nobody has to read.
  #
  # `checks` rather than main, because a daily commit on main would bury the one submission a
  # month that matters under thirty that do not. It is also the record that outlives the
  # ninety days Actions keeps a log for, which is the part worth having either way.
  #
  # It runs whatever the build did, so a run that went red is a line that says so.
  heartbeat:
    needs: build
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record the run
        env:
          RESULT: ${{ needs.build.result }}
          PLUGINS: ${{ needs.build.outputs.plugins }}
          VERSIONS: ${{ needs.build.outputs.versions }}
          OPERATIONS: ${{ needs.build.outputs.operations }}
          RULESETS: ${{ needs.build.outputs.rulesets }}
          WITHHELD: ${{ needs.build.outputs.withheld }}
        run: |
          set -euo pipefail
          checked=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin checks >/dev/null 2>&1; then
            git fetch --quiet origin checks
            git checkout --quiet -B checks origin/checks
          else
            # The first run. An orphan so that main's history is not dragged along behind a
            # file that has nothing to do with it.
            git checkout --quiet --orphan checks
            git rm -r --quiet --cached .
          fi

          jq -nc \
            --arg checked "$checked" \
            --arg run "$GITHUB_RUN_ID" \
            --arg result "$RESULT" \
            --arg plugins "${PLUGINS:-}" \
            --arg versions "${VERSIONS:-}" \
            --arg operations "${OPERATIONS:-}" \
            --arg rulesets "${RULESETS:-}" \
            --arg withheld "${WITHHELD:-}" \
            'def num: if . == "" then null else tonumber end;
             {
               checked: $checked,
               run: ($run | tonumber),
               result: $result,
               plugins: ($plugins | num),
               versions: ($versions | num),
               operations: ($operations | num),
               ruleSets: ($rulesets | num),
               withheld: ($withheld | num)
             }' >> log.jsonl

          git add log.jsonl
          git commit --quiet -m "Checked ${checked}"

          git push --quiet origin checks || {
            git fetch --quiet origin checks
            git rebase --quiet origin/checks
            git push --quiet origin checks
          }

          tail -1 log.jsonl >> "$GITHUB_STEP_SUMMARY"
