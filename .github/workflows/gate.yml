# The cases for the scripts a submission goes through.
#
# submit.yml runs them with a token that can write the ledger, from main, where nothing in a
# submission can reach them. What a pull request can reach is the scripts and the cases
# themselves, so they are run here as an ordinary check: a change that weakens a rule has to
# show up as a case that no longer passes.

name: gate

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  cases:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the admission cases
        run: bash .github/admit/test/run.sh

      - name: Run the submission cases
        run: bash .github/submit/test/run.sh
