# Fetches the packages the ledger names, reads them, and holds every entry to what its
# package actually claims.
#
# A plugin submission states four things: a package, a version, a namespace and a shorthand
# character. Three of those are claims about an assembly, and this is the job that loads it
# and finds out. A rule set submission states two, and one of them is a claim about a document
# — read here without running anything, which is the whole difference between the two kinds.
# The operations, the inputs, the requires and the uses are stated nowhere — nobody keeps a
# list of any of them in step with a release, and nobody can get one wrong — because they are
# read out of what was published here and served by the catalogue, which is derived on every
# run and committed nowhere.
#
# That is also why nothing is written back. The only file in git is the one a person reads and
# a person wrote; everything derived from it is served from the site, rebuilt on every run and
# committed nowhere, for the same reason the catalogue is.
#
# Loading a plugin is running its code, so this job holds a read-only token, no secrets, and
# writes nothing anywhere.
#
# There is deliberately no schedule. The ledger pins the version each plugin was admitted at,
# so a scheduled run would fetch the same packages for ever and reach the same answer.
# Noticing a release nobody submitted, and checking that its claims did not move, is
# catalogue.yml — which is scheduled, for exactly that reason.

name: ledger

on:
  # No paths filter. This is a required check, and a required check a pull request
  # can skip by touching other files is one that blocks that pull request for ever.
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rederive:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # Every package the ledger names, in one folder, the way a deployment holds them. The
      # script is shared with submit.yml, which points it at the ledger a submission would make.
      - name: Fetch the packages the ledger names
        run: |
          set -euo pipefail
          if ! reason=$(bash .github/ledger/fetch.sh ledger/submitted.json work); then
            echo "::error file=ledger/submitted.json::${reason}"
            exit 1
          fi

      # A folder whose plugins cannot be loaded together is a collision, and the tool reports
      # it as itself. So is a folder where two documents declare one identifier. Moving either
      # check to before both were published is the one thing about this repository that could
      # not have been added later.
      - name: Read what the packages claim
        run: dotnet run --project tool/Ledger -- work/claimed work/claim.json

      - name: Hold every entry to its package
        run: |
          set -euo pipefail
          if ! reasons=$(bash .github/admit/declared.sh ledger/submitted.json work/claim.json ledger/reserved.json); then
            echo "::error file=ledger/submitted.json::An entry does not match the package it names."
            echo "$reasons"
            exit 1
          fi

      # What the submission turned out to mean, for whoever reads the pull request. Nobody
      # wrote this and nobody has to check it — it is the assembly talking.
      - name: Show what the submission claims
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # A base without the file is a ledger with nothing in it, which makes every entry
          # here a new one. That is true of the pull request that introduces the file, and it
          # is the right answer for any other branch that has not got it yet.
          git show "origin/${BASE}:ledger/submitted.json" > work/base.json 2>/dev/null \
            || echo '{ "plugins": [], "ruleSets": [] }' > work/base.json

          added=$(jq -r --slurpfile base work/base.json \
            '[.plugins[].id, (.ruleSets // [])[].id]
             - [$base[0].plugins[].id, ($base[0].ruleSets // [])[].id] | .[]' ledger/submitted.json)

          if [[ -z "$added" ]]; then
            echo "This submits nothing." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "Read out of the packages:"
            echo
            echo '```json'
            jq --argjson ids "$(jq -R . <<<"$added" | jq -s .)" \
              '{ plugins: [.plugins[] | select(.id as $i | $ids | index($i))],
                 ruleSets: [(.ruleSets // [])[] | select(.id as $i | $ids | index($i))] }' work/claim.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
