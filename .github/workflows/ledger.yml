# Fetches the packages the ledger names, loads them, and holds every entry to what its
# package actually claims.
#
# A submission states four things: a package, a version, a namespace and a shorthand
# character. Three of those are claims about an assembly, and this is the job that loads it
# and finds out. The operations are stated nowhere — nobody keeps a list of them in step with
# a release, and nobody can get one wrong — because they are read out of the assembly here and
# published by the catalogue, which is derived on every run and committed nowhere.
#
# That is also why nothing is written back. The only file in git is the one a person reads and
# a person wrote; everything derived from it is served from the site, rebuilt on every run and
# committed nowhere, for the same reason the catalogue is.
#
# Loading a plugin is running its code, so this job holds a read-only token, no secrets, and
# writes nothing anywhere.
#
# There is deliberately no schedule. The ledger pins the version each plugin was admitted at,
# so a scheduled run would fetch the same packages for ever and reach the same answer.
# Noticing a release nobody submitted, and checking that its claims did not move, is
# catalogue.yml — which is scheduled, for exactly that reason.

name: ledger

on:
  # No paths filter. This is a required check, and a required check a pull request
  # can skip by touching other files is one that blocks that pull request for ever.
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rederive:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      # One project referencing exactly the packages the ledger names, published so that the
      # assemblies land in one folder. What else lands there does not matter: LoadPluginsFrom
      # sweeps a folder and passes over assemblies with no plugin in them, which is why
      # pointing it at an application's own output is a reasonable thing to do.
      - name: Fetch the packages the ledger names
        run: |
          set -euo pipefail
          mkdir -p work
          dotnet new classlib -o work/Fetch --framework net10.0 > /dev/null
          jq -r '.plugins[] | "\(.id) \(.version)"' ledger/submitted.json | while read -r id version; do
            echo "::group::${id} ${version}"
            dotnet add work/Fetch package "${id}" --version "${version}"
            echo "::endgroup::"
          done
          dotnet publish work/Fetch -c Release -o work/plugin

      # A folder whose plugins cannot be loaded together is a collision, and the tool reports
      # it as itself. Moving that check to before both plugins are published is the one thing
      # about this repository that could not have been added later.
      - name: Read what the packages claim
        run: dotnet run --project tool/Ledger -- work/plugin work/claim.json

      - name: Hold every entry to its package
        run: |
          set -euo pipefail
          if ! reasons=$(bash .github/admit/declared.sh ledger/submitted.json work/claim.json ledger/reserved.json); then
            echo "::error file=ledger/submitted.json::An entry does not match the package it names."
            echo "$reasons"
            exit 1
          fi

      # What the submission turned out to mean, for whoever reads the pull request. Nobody
      # wrote this and nobody has to check it — it is the assembly talking.
      - name: Show what the submission claims
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # A base without the file is a ledger with nothing in it, which makes every entry
          # here a new one. That is true of the pull request that introduces the file, and it
          # is the right answer for any other branch that has not got it yet.
          git show "origin/${BASE}:ledger/submitted.json" > work/base.json 2>/dev/null \
            || echo '{ "plugins": [] }' > work/base.json

          added=$(jq -r --slurpfile base work/base.json \
            '[.plugins[].id] - [$base[0].plugins[].id] | .[]' ledger/submitted.json)

          if [[ -z "$added" ]]; then
            echo "This submits no plugin." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "Read out of the packages:"
            echo
            echo '```json'
            jq --argjson ids "$(jq -R . <<<"$added" | jq -s .)" \
              '{ plugins: [.plugins[] | select(.id as $i | $ids | index($i))] }' work/claim.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
